# Decap CMS — git-based, auth by DecapBridge (PKCE; editors log in with
# Google/Microsoft/password — no GitHub accounts needed). Repo pushes use the
# fine-grained token held in the DecapBridge dashboard, never in this repo.
backend:
  name: git-gateway
  repo: codinginafk/somenews
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/128259a1-efd9-4b07-af83-70deeb1e3f54/pkce
  auth_token_endpoint: /sites/128259a1-efd9-4b07-af83-70deeb1e3f54/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Bridge identity claims (first/last name + avatar show up on commits)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

local_backend: false
media_folder: 'public/uploads'
public_folder: '/uploads'
site_url: https://rentfreenews.com
display_url: https://rentfreenews.com
logo_url: /favicon.svg

collections:
  - name: 'news'
    label: 'News / Checks'
    folder: 'src/content/news'
    create: true
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Excerpt', name: 'excerpt', widget: 'text' }
      - { label: 'SEO Title (SERP; falls back to Title)', name: 'seoTitle', widget: 'string', required: false }
      - { label: 'Meta Description (falls back to Excerpt)', name: 'description', widget: 'text', required: false }
      - { label: 'Category', name: 'category', widget: 'select', options: ['Reality Check', 'By the Numbers', 'Countries', 'Lab Tested'] }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - { label: 'Author', name: 'author', widget: 'string', default: 'Diyan' }
      - { label: 'Author Role', name: 'authorRole', widget: 'string', default: 'Staff Writer' }
      - { label: 'Publish Date', name: 'pubDate', widget: 'datetime' }
      - { label: 'Updated Date', name: 'updatedDate', widget: 'datetime', required: false }
      - { label: 'Hero Image', name: 'heroImage', widget: 'image', required: false }
      - { label: 'Featured (homepage hero)', name: 'featured', widget: 'boolean', default: false }
      - { label: 'Trending (ticker + most-read)', name: 'trending', widget: 'boolean', default: false }
      - { label: 'Viral Claim We Checked', name: 'claim', widget: 'string', required: false }
      - { label: 'Claim Source', name: 'claimSource', widget: 'string', required: false }
      - { label: 'Verdict', name: 'verdict', widget: 'select', options: ['True with context', 'Misleading — Missing Context', 'False — with context', 'Missing Context', 'Explainer'], default: 'Missing Context' }
      - { label: 'Primary Source (label)', name: 'primarySource', widget: 'string', required: false }
      - { label: 'Primary Source (URL)', name: 'primarySourceUrl', widget: 'string', required: false }
      - { label: 'Why It Matters (1-2 sentences)', name: 'whyItMatters', widget: 'text', required: false }
      - label: 'Sources'
        name: 'sources'
        widget: 'list'
        required: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'URL', name: 'url', widget: 'string' }
          - { label: 'Publisher', name: 'publisher', widget: 'string' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
