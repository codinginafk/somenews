name: Deploy demo-news (Astro → Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ['demo-news/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['demo-news/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-news/package-lock.json
      # Fail fast: catch a missing/empty/expired Cloudflare token HERE, in a
      # step that names itself, instead of dying inside wrangler after a full build.
      - name: Cloudflare auth preflight (fail fast)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty"
            exit 1
          fi
          npx --yes wrangler@3.90.0 whoami
      - run: npm ci
      - run: npm run build
      # Cloudflare Pages direct upload (fastest, free). Set secrets in GitHub:
      # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PROJECT_NAME
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./demo-news/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true
